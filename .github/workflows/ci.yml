name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: 测试 (${{ matrix.os }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: 代码风格检查
        run: ruff check src tests

      - name: 单元测试
        run: pytest -q

  build:
    name: 打包验证 (Windows)
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gui]" pyinstaller

      - name: 打包
        run: python build.py

      - name: 冒烟测试（命令行模式）
        run: |
          dist\sitecheck\sitecheck.exe --version

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: sitecheck-windows-x64
          path: dist/sitecheck/
          retention-days: 7
