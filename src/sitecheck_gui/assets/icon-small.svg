<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- 小尺寸专用（<=32px）：笔画整体加粗、去掉镜片内填充与高光，
       否则缩到 16px 时镜圈和对勾会糊成一团。 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2B6CF0"/>
      <stop offset="1" stop-color="#00B8D9"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="104" fill="url(#bg)"/>

  <path d="M332 308 L404 380" stroke="#FFFFFF" stroke-width="66" stroke-linecap="round"/>
  <circle cx="230" cy="206" r="126" fill="none" stroke="#FFFFFF" stroke-width="58"/>
  <path d="M186 206 L218 240 L284 172" fill="none" stroke="#33E08F" stroke-width="58"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
